<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Recipes — рецепты с КБЖУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="#" class="brand">
      <span class="brand-mark">FR</span>
      <span class="brand-text">
        <strong>Food Recipes</strong>
        <span>Рецепты · КБЖУ · Видео</span>
      </span>
    </a>
    <nav class="site-nav">
      <a href="#recipes-list">Рецепты</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="toolbar">
    <div class="toolbar-row">
      <div class="search-wrap">
        <label for="search-input" class="field-label">Поиск</label>
        <input type="search" id="search-input"
               placeholder="Название блюда или ингредиент — например: яичница, тунец"
               autocomplete="off">
      </div>
      <div class="select-wrap">
        <label for="filter-category" class="field-label">Категория</label>
        <select id="filter-category">
          <option value="all">Все категории</option>
          <option value="завтрак">Завтрак</option>
          <option value="обед">Обед</option>
          <option value="ужин">Ужин</option>
          <option value="перекус">Перекус</option>
        </select>
      </div>
    </div>
    <div class="toolbar-meta">
      <span id="results-count" class="results-count">Найдено: 0 рецептов</span>
    </div>
  </section>

  <section id="recipes-list" class="recipes-grid"></section>

</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 Food Recipes · GitHub Pages</p>
  </div>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
